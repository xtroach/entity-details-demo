# Serves the published Blazor WebAssembly client as a single-page app.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # dotnet publish already writes .gz copies of the static assets; serve those instead of
    # compressing on every request.
    gzip_static on;

    location / {
        # Client-side routes (e.g. /weather) have no file on disk; hand them to the Blazor router.
        try_files $uri $uri/ /index.html;
    }

    # index.html and appsettings.json change between deployments/containers under the same name;
    # everything under _framework is fingerprinted and safe to cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache";
    }
}
