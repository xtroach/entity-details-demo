# Audits the rule documents against each other, and against the configuration they describe, on a
# pull request carrying the docs-coherence-review label. The rubric lives in
# .claude/skills/doc-coherence/SKILL.md.
#
# The label is the trigger, deliberately, because the audit is an opus run and a pull request is
# not one commit. Auditing every push spent one run per increment on diffs nobody had reviewed
# yet -- this pull request alone burned thirteen. Changes now accumulate unaudited until a
# reviewer asks for the audit by adding the label; from that point the label stays on and every
# further push re-audits, so a fix made in response to findings is checked without being asked
# for again. Removing the label is the off switch, and is how a pull request goes back to
# accumulating.
#
# Findings are reported in exactly one place: a comment on the pull request that introduced them.
# There is deliberately no repository-wide audit and no findings issue -- drift is answered for by
# the pull request that caused it, or not at all.
#
# Deliberately NOT a required status check on main, for two independent reasons:
#   - Whether it runs at all is a reviewer's decision, so on an unlabelled pull request it never
#     reports, and a required check that never reports blocks merging forever.
#   - It is a model, not a deterministic script. A false positive must never be able to wedge a
#     merge. It comments; the owner decides.
name: Docs coherence

on:
  pull_request:
    # labeled is the reviewer asking for the audit; synchronize keeps it running on every later
    # push while the label is still on. Listing types REPLACES the default
    # [opened, synchronize, reopened] rather than adding to it, so synchronize has to be named
    # here -- without it the label would fire exactly once and then sit inert, and a fix pushed in
    # response to findings would never be re-audited.
    types: [labeled, synchronize]
    # Pull requests into main only, deliberately. A stacked pull request (base: another feature
    # branch) is not audited on its own page, and does not need to be: its content cannot reach
    # main without passing through a pull request whose base IS main, and labelling that pull
    # request audits the combined diff against main. Auditing the stack member as well would
    # double-report the same content, and would audit it against its base branch rather than
    # against main -- the weaker comparison of the two.
    branches: [main]

# Least privilege: read the repository, and write only the findings comment.
permissions:
  contents: read
  pull-requests: write

# A new push to a labelled pull request cancels that pull request's audit in progress, so a run
# is never spent on a diff that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coherence:
    name: Docs coherence
    # Two event shapes, one gate. On labeled, github.event.label is the label just added; on
    # synchronize it is null, and the standing labels on the pull request are what decides. There
    # is no label filter at the `on:` level, so an unrelated label added to any pull request into
    # main still starts a run -- this skips its only job, which costs nothing and reports nothing.
    if: >-
      github.event.label.name == 'docs-coherence-review' ||
      contains(github.event.pull_request.labels.*.name, 'docs-coherence-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The rubric diffs the pull request against its merge base, so the history has to be there.
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        env:
          # gh reads GH_TOKEN; the allowlist below limits it to commenting on this pull request.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A subscription token from `claude setup-token`, so runs don't incur separate API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Explicit, so the action does not fall back to authenticating as the Claude GitHub App,
          # whose permission set is far wider than posting one comment needs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Supplying a prompt puts the action in automation mode: it runs on the event itself,
          # with no @claude mention. The rubric is the checked-out skill.
          prompt: |
            /doc-coherence
            Mode: pull-request.
            Base commit: ${{ github.event.pull_request.base.sha }}
            Pull request: #${{ github.event.pull_request.number }}
            Post findings as one comment on that pull request. If there are no findings, post
            nothing at all.
          # There is deliberately no --max-turns. It is not a budget: the action compares the
          # num_turns a run REPORTS against the ceiling only after that run has finished, so it
          # cannot stop, shorten or cheapen anything. Run 35511209528 proved it -- at --max-turns
          # 20 the audit reached 27 turns, returned is_error false, posted its findings comment,
          # and only then failed the step. The sole effect a ceiling can have here is to turn a
          # successful audit red. timeout-minutes on the job above is the real runaway guard.
          #
          # This matters because CLAUDE.md treats a red advisory run as "not ready": a ceiling
          # that manufactures false failures would gate readiness on a bookkeeping mismatch,
          # which is the wedge this check is designed not to be. A red run here should mean
          # something genuinely went wrong -- a missing credential, a rate limit, an action bug.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
