# Audits the rule documents against each other when a pull request changes one of them, or changes
# configuration those documents describe. The rubric lives in .claude/skills/doc-coherence/SKILL.md.
#
# Findings are reported in exactly one place: a comment on the pull request that introduced them.
# There is deliberately no repository-wide audit and no findings issue -- drift is answered for by
# the pull request that caused it, or not at all.
#
# Deliberately NOT a required status check on main, for two independent reasons:
#   - It is path-filtered, so on a pull request touching none of these files it never reports at
#     all, and a required check that never reports blocks merging forever.
#   - It is a model, not a deterministic script. A false positive must never be able to wedge a
#     merge. It comments; the owner decides.
name: Docs coherence

on:
  pull_request:
    # Pull requests into main only, deliberately. A stacked pull request (base: another feature
    # branch) is not audited on its own page, and does not need to be: its content cannot reach
    # main without passing through a pull request whose base IS main, and that pull request
    # re-runs this check on every push, auditing the combined diff against main. Auditing the
    # stack member as well would double-report the same content, and would audit it against its
    # base branch rather than against main -- the weaker comparison of the two.
    branches: [main]
    # The files where a contradiction between CLAUDE.md, README.md and the configuration they
    # describe can actually be introduced -- not every file those documents mention. Being under
    # a project's src/ or test/ does not exempt a file: the Dockerfiles hold the base-image
    # digests README's "every input is pinned" list claims, and they live under Api/src/ and
    # BlazorClient/src/. Api.Tests' PostgresFixture is deliberately NOT listed, though README
    # documents it: the drift it describes starts when docker-compose.yml's PostgreSQL image is
    # bumped without the hand-copy reaching the fixture, so watching the Compose file catches it
    # at the source, and a path glob naming one .cs file would break silently on a rename.
    paths:
      - CLAUDE.md
      - README.md
      - .editorconfig
      - Directory.Build.props
      - Directory.Packages.props
      - .gitattributes
      - global.json
      # The rest of README's pinned-versions list: the dotnet-ef pin, the Compose PostgreSQL
      # image (whose bump has to reach PostgresFixture by hand), and base-image digests.
      - .config/dotnet-tools.json
      - docker-compose.yml
      - "**/Dockerfile"
      # Staging's resources, deploy identity and environment variables are documented in detail.
      - "infra/**"
      # The rubric itself: README describes what it does and how it reports, so it can drift from
      # those claims like any other watched file. Without this a pull request changing only the
      # rubric never runs the check the rubric defines.
      - ".claude/skills/**"
      - .github/workflows/**
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/ISSUE_TEMPLATE/**

# Least privilege: read the repository, and write only the findings comment.
permissions:
  contents: read
  pull-requests: write

# A new push to a pull request cancels that pull request's audit in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coherence:
    name: Docs coherence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The rubric diffs the pull request against its merge base, so the history has to be there.
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        env:
          # gh reads GH_TOKEN; the allowlist below limits it to commenting on this pull request.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A subscription token from `claude setup-token`, so runs don't incur separate API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Explicit, so the action does not fall back to authenticating as the Claude GitHub App,
          # whose permission set is far wider than posting one comment needs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Supplying a prompt puts the action in automation mode: it runs on the event itself,
          # with no @claude mention. The rubric is the checked-out skill.
          prompt: |
            /doc-coherence
            Mode: pull-request.
            Base commit: ${{ github.event.pull_request.base.sha }}
            Pull request: #${{ github.event.pull_request.number }}
            Post findings as one comment on that pull request. If there are no findings, post
            nothing at all.
          # There is deliberately no --max-turns. It is not a budget: the action compares the
          # num_turns a run REPORTS against the ceiling only after that run has finished, so it
          # cannot stop, shorten or cheapen anything. Run 35511209528 proved it -- at --max-turns
          # 20 the audit reached 27 turns, returned is_error false, posted its findings comment,
          # and only then failed the step. The sole effect a ceiling can have here is to turn a
          # successful audit red. timeout-minutes on the job above is the real runaway guard.
          #
          # This matters because CLAUDE.md treats a red advisory run as "not ready": a ceiling
          # that manufactures false failures would gate readiness on a bookkeeping mismatch,
          # which is the wedge this check is designed not to be. A red run here should mean
          # something genuinely went wrong -- a missing credential, a rate limit, an action bug.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
