# Full audit of the rule set: CLAUDE.md and README.md against each other, against themselves, and
# against the configuration they describe. The rubric lives in
# .claude/skills/doc-coherence/SKILL.md, shared with the per-pull-request workflow.
#
# Run on demand only, deliberately: there is no `schedule:` here. The per-pull-request workflow
# already audits drift at the moment it is introduced, and almost every change to a rule document
# or a file it describes arrives through a pull request, so a recurring sweep would mostly re-report
# what that check already commented on. The rolling-issue protocol below is also prompt-enforced
# rather than mechanical, and GitHub runs scheduled workflows only from the default branch, so a
# cadence cannot be tested before it is merged. Add a `schedule:` once the pull-request check has a
# track record and this protocol has been watched working.
#
# Findings are reported through a single rolling issue labelled `doc-coherence`, whose body each run
# rewrites, rather than one comment per run. Drift that survives several audits then produces one
# issue, not a notification every time. The audit never closes that issue — that is the owner's call.
name: Docs coherence audit

on:
  workflow_dispatch:

# Least privilege: read the repository, and write only the rolling findings issue.
permissions:
  contents: read
  issues: write

# One audit at a time. A second dispatch while one is working waits rather than racing it for the
# rolling issue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: Docs coherence audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        env:
          # gh reads GH_TOKEN; the allowlist below limits it to the issue operations the rubric needs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A subscription token from `claude setup-token`, so runs don't incur separate API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Explicit, so the action does not fall back to authenticating as the Claude GitHub App,
          # whose permission set is far wider than filing one issue needs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /doc-coherence
            Mode: full-audit.
            Audit the whole rule set, not a diff.
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Report through the rolling issue labelled `doc-coherence`, exactly as the rubric's
            full-audit table describes. Never close that issue.
          # Matches the pull-request check's 50, for the reason documented there: --max-turns is a
          # ceiling the action checks AFTER the run finishes, against the num_turns it reports, so
          # it has to clear what a complete audit reports rather than what it needs to do the work.
          # The full audit reads every pair in the rubric's coverage table instead of one diff, so
          # it reports more turns than the pull-request check, not fewer -- and unlike that check,
          # this one cannot be exercised before merge, since GitHub registers a workflow_dispatch
          # workflow only from the default branch. Too low a ceiling here surfaces as a failed
          # manual dispatch after merge.
          claude_args: |
            --model claude-opus-5
            --max-turns 50
            --allowedTools "Read,Grep,Glob,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"
